version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: familier-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: familier
      MYSQL_USER: familier
      MYSQL_PASSWORD: familier123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - familier-network

  mongodb:
    image: mongo:latest
    container_name: familier-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - familier-network

  core-service:
    build:
      context: ./core_service
      dockerfile: Dockerfile
    container_name: familier-core-service
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/familier
      - DB_USER=familier
      - DB_PASSWORD=familier123
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_key_change_me_in_prod}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-default_internal_secret}
      - PUBLIC_GOOGLE_CLIENT_ID=${PUBLIC_GOOGLE_CLIENT_ID}
      - APP_ADMIN_USER=${APP_ADMIN_USER:-admin}
      - APP_ADMIN_PASS=${APP_ADMIN_PASS:-admin123}
      - PORT=8081
    depends_on:
      - mysql
    networks:
      - familier-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: familier-gateway
    ports:
      - "8080:8080"
    environment:
      - CORE_SERVICE_URL=http://core-service:8081
      - AI_SERVICE_URL=http://ai-service:8082
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_key_change_me_in_prod}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-default_internal_secret}
      - GATEWAY_PORT=8080
      - PORT=8080
    depends_on:
      - core-service
      - ai-service
    networks:
      - familier-network

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: familier-ai-service
    ports:
      - "8082:8082"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017/familier_ai
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - CORE_SERVICE_URL=http://core-service:8081
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-default_internal_secret}
      - AI_SERVICE_PORT=8082
      - PORT=8082
    depends_on:
      - mongodb
      - qdrant
    networks:
      - familier-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: familier-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - familier-network

networks:
  familier-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  qdrant_data:
