spring:
  cloud:
    gateway:
      routes:
        - id: ai_service_route
          uri: ${AI_SERVICE_URL}
          predicates:
            - Path=/ai/**
          filters:
            - AuthenticationFilter
        - id: core_service_public_route
          uri: ${CORE_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**, /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**, /actuator/**
        - id: core_service_route
          uri: ${CORE_SERVICE_URL}
          predicates:
            - Path=/**
          filters:
            - AuthenticationFilter

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
    internal:
      secret: ${INTERNAL_SHARED_SECRET:default_internal_secret}

server:
  port: ${GATEWAY_PORT:8080}