syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.familier.grpc";
option java_outer_classname = "UserContextProto";

package usercontext;

service UserContextService {
  rpc GetUserProfile (UserRequest) returns (UserProfileResponse);
}

message UserRequest {
  string email = 1;
}

message UserProfileResponse {
  string email = 1;
  string full_name = 2;
  string profile_json = 3;
}
