spring.application.name=Familier AI Service
gemini.api-key=${GEMINI_API_KEY}
gemini.timeout=${GEMINI_TIMEOUT:120}
gemini.retry-attempts=${GEMINI_RETRY_ATTEMPTS:4}
gemini.retry-delay=${GEMINI_RETRY_DELAY:3}
server.port=${AI_SERVICE_PORT:8082}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/familier_ai}

# gRPC Client Configuration
grpc.client.usercontext.address=${GRPC_USER_CONTEXT_ADDRESS:static://localhost:9090}
grpc.client.usercontext.negotiation-type=plaintext

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false

# Core Service URL (REST fallback)
CORE_SERVICE_URL=${CORE_SERVICE_URL:http://localhost:8081}

# Internal Security
application.security.internal.secret=${INTERNAL_SHARED_SECRET:default_internal_secret}

# Scheduler Configuration
scheduler.summarization.fixed-delay=${SCHEDULER_SUMMARIZATION_FIXED_DELAY:900000}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.gemini-api.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.gemini-api.slidingWindowSize=10
resilience4j.circuitbreaker.instances.gemini-api.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.gemini-api.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.gemini-api.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.gemini-api.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.gemini-api.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.slowCallDurationThreshold=10s

# Resilience4j Retry Configuration
resilience4j.retry.instances.gemini-api.maxAttempts=3
resilience4j.retry.instances.gemini-api.waitDuration=2000
resilience4j.retry.instances.gemini-api.retryExceptions=java.util.concurrent.TimeoutException,io.netty.handler.timeout.ReadTimeoutException,java.net.ConnectException

management.endpoints.web.exposure.include=health
management.health.circuitbreakers.enabled=true
