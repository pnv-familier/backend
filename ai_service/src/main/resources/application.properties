spring.application.name=Familier AI Service
gemini.api-key=${GEMINI_API_KEY}
server.port=${AI_SERVICE_PORT:8082}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/familier_ai}

# gRPC Client Configuration
grpc.client.usercontext.address=${GRPC_USER_CONTEXT_ADDRESS:static://localhost:9090}
grpc.client.usercontext.negotiation-type=plaintext

