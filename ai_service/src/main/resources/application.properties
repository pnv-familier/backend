# Spring AI — Google GenAI (Gemini)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:default-key}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.7
gemini.timeout=${GEMINI_TIMEOUT:120}
server.port=${AI_SERVICE_PORT:8082}

# Debug logging for RAG / summarization / tool tracing
logging.level.com.familier.ai=DEBUG
logging.level.com.familier.ai.service.ContextManagerService=DEBUG
logging.level.com.familier.ai.service.SummarizationService=DEBUG
logging.level.com.familier.ai.service.SummarizationScheduler=DEBUG

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/familier_ai}

# gRPC Client Configuration
grpc.client.usercontext.address=${GRPC_USER_CONTEXT_ADDRESS:static://localhost:9090}
grpc.client.usercontext.negotiation-type=plaintext

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false

# Internal Security
application.security.internal.secret=${INTERNAL_SHARED_SECRET:default_internal_secret}

# Scheduler Configuration
scheduler.summarization.fixed-delay=1800000
app.summarization.enabled=${SUMMARIZATION_ENABLED:false}
app.summarization.concurrency=${SUMMARIZATION_CONCURRENCY:1}
app.summarization.idle-minutes=${SUMMARIZATION_IDLE_MINUTES:0}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.gemini-api.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.gemini-api.slidingWindowSize=10
resilience4j.circuitbreaker.instances.gemini-api.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.gemini-api.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.gemini-api.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.gemini-api.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.gemini-api.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.slowCallDurationThreshold=10s

# Resilience4j Retry Configuration
resilience4j.retry.instances.gemini-api.maxAttempts=3
resilience4j.retry.instances.gemini-api.waitDuration=2000
resilience4j.retry.instances.gemini-api.retryExceptions=java.util.concurrent.TimeoutException,io.netty.handler.timeout.ReadTimeoutException,java.net.ConnectException

management.endpoints.web.exposure.include=health
management.health.circuitbreakers.enabled=true

spring.jackson.serialization.write-dates-as-timestamps=false

ai.mock=false

# --- Qdrant Vector Store ---
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=familier_context
spring.ai.vectorstore.qdrant.initialize-schema=true

# --- Embedding Model (Google GenAI) ---
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:default-key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# --- Qdrant Sync Config ---
app.vectorsync.batch-size=20