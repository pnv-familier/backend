# Disable gRPC Client for production
grpc.client.usercontext.address=static://localhost:9999
grpc.client.usercontext.negotiation-type=plaintext

# Disable gRPC auto-configuration for production
spring.autoconfigure.exclude=net.devh.boot.grpc.client.autoconfigure.GrpcClientAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientMetricAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientHealthAutoConfiguration
logging.level.root=WARN